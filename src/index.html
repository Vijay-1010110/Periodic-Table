<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PeriodicaX - Definitive Periodic Table</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=IBM+Plex+Mono:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
    
    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <!-- CSS_INJECT -->
</head>
<body class="theme-dark">
    <nav class="top-nav">
        <div class="logo">PeriodicaX</div>
        <div class="mode-buttons">
            <button class="nav-btn active" data-mode="table">Table</button>
            <button class="nav-btn" data-mode="trends">Trends</button>
            <button class="nav-btn" data-mode="compare">Compare</button>
            <button class="nav-btn" data-mode="quiz">Quiz</button>
        </div>
        <div class="nav-controls">
            <button class="icon-btn" id="btn-settings" aria-label="Settings" title="Settings">⚙️</button>
            <button class="icon-btn" id="btn-about" aria-label="About" title="About this data">ℹ️</button>
        </div>
    </nav>

    <main class="app-container">
        <!-- LEFT PANEL (Grid) -->
        <section class="panel panel-left">
            <div class="panel-header">
                <div class="controls-row">
                    <input type="text" id="search-bar" placeholder="Search element... (e.g. Carbon, Au, 79)">
                    <select id="env-simulator" title="Environment Simulator">
                        <option value="stp">Standard Conditions (STP)</option>
                        <option value="human">Human Body</option>
                        <option value="ocean">Seawater</option>
                        <option value="volcano">Volcanic Gas</option>
                        <option value="space">Outer Space</option>
                    </select>
                </div>
                
                <div class="color-modes">
                    <button class="mode-btn active" data-color="category">Category</button>
                    <button class="mode-btn" data-color="state">State</button>
                    <button class="mode-btn" data-color="electronegativity">Electronegativity</button>
                    <button class="mode-btn" data-color="radius">Radius</button>
                    <button class="mode-btn" data-color="block">Block</button>
                </div>

                <div class="temp-controller">
                    <div class="temp-header">
                        <label>Temperature: <span id="temp-display" class="mono-text">298 K</span></label>
                        <div class="temp-unit-toggle">
                            <button class="unit-btn active" data-unit="K">K</button>
                            <button class="unit-btn" data-unit="C">°C</button>
                            <button class="unit-btn" data-unit="F">°F</button>
                        </div>
                    </div>
                    <input type="range" id="temp-slider" min="0" max="6000" value="298">
                    <div class="temp-presets">
                        <button class="preset-btn" data-temp="0" title="Absolute Zero">0K</button>
                        <button class="preset-btn" data-temp="77" title="Liquid Nitrogen">77K</button>
                        <button class="preset-btn" data-temp="298" title="Room Temp">298K</button>
                        <button class="preset-btn" data-temp="310" title="Body Temp">310K</button>
                        <button class="preset-btn" data-temp="5778" title="Surface of Sun">5778K</button>
                    </div>
                    <div id="state-counter" class="mono-text small-text"></div>
                </div>
            </div>

            <div class="grid-wrapper">
                <div class="periodic-grid" id="periodic-grid">
                    <!-- Grid items injected by JS -->
                </div>
            </div>
            
            <div class="legend" id="grid-legend">
                <!-- Legend injected by JS -->
            </div>
        </section>

        <!-- CENTER PANEL (Detail Hub) -->
        <section class="panel panel-center">
            <div id="empty-state" class="empty-state">
                <div class="empty-icon">⚛️</div>
                <p>Select an element from the table to explore</p>
            </div>

            <div id="element-detail-hub" class="hidden">
                <header class="detail-header">
                    <div class="element-card" id="detail-card">
                        <div class="ec-top mono-text">
                            <span id="dh-number"></span>
                            <span id="dh-mass"></span>
                        </div>
                        <div class="ec-symbol mono-text" id="dh-symbol"></div>
                        <div class="ec-name" id="dh-name"></div>
                        <div class="ec-badges">
                            <span class="badge" id="dh-category"></span>
                            <span class="badge" id="dh-state"></span>
                        </div>
                    </div>
                </header>

                <div class="tabs">
                    <button class="tab-btn active" data-tab="overview">Overview</button>
                    <button class="tab-btn" data-tab="physical">Physical</button>
                    <button class="tab-btn" data-tab="atomic">Atomic</button>
                    <button class="tab-btn" data-tab="chemical">Chemical</button>
                    <button class="tab-btn" data-tab="isotopes">Isotopes</button>
                    <button class="tab-btn" data-tab="compounds">Compounds</button>
                </div>

                <div class="tab-content active" id="tab-overview">
                    <div class="content-section">
                        <h3>Discovery</h3>
                        <p id="dh-discovery-text" class="body-text"></p>
                    </div>
                    <div class="content-section">
                        <h3>Appearance</h3>
                        <p id="dh-appearance-text" class="body-text"></p>
                    </div>
                    <div class="content-section">
                        <h3>Fun Facts</h3>
                        <ul id="dh-facts-list" class="body-text list-disc"></ul>
                    </div>
                </div>
                
                <div class="tab-content" id="tab-physical">
                    <div class="content-section">
                        <h3>Physical Properties</h3>
                        <table class="data-table">
                            <tbody id="dh-physical-table"></tbody>
                        </table>
                    </div>
                </div>

                <!-- We will add other tabs content dynamically or expand later -->
                <div class="tab-content" id="tab-atomic">
                    <div class="content-section">
                        <h3>Electron Configuration</h3>
                        <div class="mono-text" id="dh-econfig"></div>
                        <div class="mono-text" id="dh-econfig-noble"></div>
                    </div>
                </div>
                
                <div class="tab-content" id="tab-chemical">
                    <div class="content-section">
                        <h3>Chemical Behavior</h3>
                    </div>
                </div>
                
                <div class="tab-content" id="tab-isotopes">
                    <div class="content-section">
                        <h3>Isotopes</h3>
                    </div>
                </div>
                
                <div class="tab-content" id="tab-compounds">
                    <div class="content-section">
                        <h3>Common Compounds</h3>
                    </div>
                </div>
            </div>
        </section>

        <!-- RIGHT PANEL (Orbital Viewer) -->
        <section class="panel panel-right">
            <div class="orbital-viewer">
                <div class="ov-header">
                    <h3>3D Orbital Viewer</h3>
                    <div class="orbital-controls">
                        <select id="orbital-n">
                            <option value="1">n=1</option>
                            <option value="2">n=2</option>
                            <option value="3">n=3</option>
                            <option value="4">n=4</option>
                        </select>
                        <select id="orbital-l">
                            <option value="0">s</option>
                            <option value="1">p</option>
                            <option value="2">d</option>
                            <option value="3">f</option>
                        </select>
                        <select id="orbital-ml">
                            <option value="0">m=0</option>
                        </select>
                    </div>
                </div>
                
                <div id="three-canvas-container">
                    <!-- Three.js renders here -->
                </div>
                
                <div class="rdf-plot-container">
                    <h4>Radial Distribution</h4>
                    <canvas id="rdf-canvas"></canvas>
                </div>
            </div>
        </section>
    </main>

    <!-- JS_DATA_INJECT -->
    <!-- JS_MAIN_INJECT -->
</body>
</html>
